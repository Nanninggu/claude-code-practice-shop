<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopNow - 내 주문</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header></header>
<main>
    <h2>내 주문</h2>
    <div class="summary panel" id="summary"></div>
    <div class="msg" id="msg"></div>
    <div id="orders"></div>
</main>

<script src="/js/common.js"></script>
<script>
    renderHeader('orders');
    load();

    function load() {
        api('GET', '/api/orders/summary').then(function (res) {
            if (!res.ok) return;
            var s = res.data.data;
            document.getElementById('summary').innerHTML = Object.keys(s).map(function (k) {
                return '<div>' + k + '<b>' + s[k] + '</b></div>';
            }).join('');
        });

        api('GET', '/api/orders').then(function (res) {
            if (!res.ok) {
                document.getElementById('orders').innerHTML = '<div class="empty">주문 목록을 불러오지 못했습니다.</div>';
                return;
            }
            var orders = res.data.data;
            if (orders.length === 0) {
                document.getElementById('orders').innerHTML = '<div class="empty">주문 내역이 없습니다.</div>';
                return;
            }
            document.getElementById('orders').innerHTML = orders.map(renderOrder).join('');
        });
    }

    function renderOrder(o) {
        var canPay = o.status === 'CREATED';
        var canCancel = ['CREATED', 'PAID', 'PREPARING', 'PARTIAL_CANCELED'].indexOf(o.status) >= 0;
        var canPartial = o.status === 'PAID' || o.status === 'PARTIAL_CANCELED';
        var canConfirm = o.status === 'DELIVERED';

        var items = o.items.map(function (item) {
            var remain = item.quantity - item.canceledQuantity;
            var canceled = item.canceledQuantity > 0
                ? '<span class="canceled">(' + item.canceledQuantity + '개 취소)</span>' : '';
            var partialBtn = canPartial && remain > 0
                ? ' <button class="secondary" style="padding:2px 8px;font-size:12px" onclick="partialCancel(' + o.orderId + ',' + item.itemId + ',' + remain + ')">부분취소</button>'
                : '';
            return '<div class="item"><span>' + escapeHtml(item.productName) + ' × ' + item.quantity + canceled + '</span>' +
                '<span>' + formatPrice(item.unitPrice * item.quantity) + partialBtn + '</span></div>';
        }).join('');

        var actions = '';
        if (canPay) actions += '<button onclick="pay(' + o.orderId + ')">결제하기</button>';
        if (canConfirm) actions += '<button onclick="confirmPurchase(' + o.orderId + ')">구매확정</button>';
        actions += '<button class="secondary" onclick="reOrder(' + o.orderId + ')">재주문</button>';
        if (canCancel) actions += '<button class="danger" onclick="cancelOrder(' + o.orderId + ')">주문취소</button>';

        return '<div class="order">' +
            '<div class="head"><div><span class="no">' + escapeHtml(o.orderNumber) + '</span>' +
            '<span class="date">' + formatDate(o.createdAt) + '</span></div>' +
            '<span class="badge ' + o.status + '">' + STATUS_LABEL[o.status] + '</span></div>' +
            '<div class="items">' + items + '</div>' +
            '<div class="row between"><span style="color:#6b7280;font-size:12px">' +
            '상품 ' + formatPrice(o.totalPrice) + ' · 할인 -' + formatPrice(o.discountPrice) +
            ' · 배송비 ' + formatPrice(o.shippingFee) + ' · 포인트 -' + formatPrice(o.usedPoint) +
            (o.trackingNo ? ' · 송장 ' + escapeHtml(o.trackingNo) : '') + '</span>' +
            '<b>' + formatPrice(o.payPrice) + '</b></div>' +
            '<div class="actions">' + actions + '</div>' +
            '</div>';
    }

    function result(res, okText) {
        var msg = document.getElementById('msg');
        if (!res.ok) {
            showMsg(msg, false, errorMessage(res));
        } else {
            showMsg(msg, true, okText);
            load();
            loadMemberPoint();
        }
        window.scrollTo(0, 0);
    }

    function pay(orderId) {
        var cardNo = prompt('카드번호를 입력하세요', '1234-5678-9012-3456');
        if (!cardNo) return;
        api('POST', '/api/payments', { orderId: orderId, method: 'CARD', cardNo: cardNo })
            .then(function (res) { result(res, '결제가 완료되었습니다.'); });
    }

    function cancelOrder(orderId) {
        var reason = prompt('취소 사유를 입력하세요', '단순 변심');
        if (reason === null) return;
        api('POST', '/api/orders/' + orderId + '/cancel', { reason: reason })
            .then(function (res) { result(res, '주문이 취소되었습니다.'); });
    }

    function partialCancel(orderId, itemId, remain) {
        var qty = prompt('취소할 수량 (최대 ' + remain + '개)', '1');
        if (!qty) return;
        api('POST', '/api/orders/' + orderId + '/partial-cancel', { itemId: itemId, quantity: Number(qty) })
            .then(function (res) { result(res, '부분 취소되었습니다.'); });
    }

    function confirmPurchase(orderId) {
        api('POST', '/api/orders/' + orderId + '/confirm')
            .then(function (res) { result(res, '구매확정 되었습니다.'); });
    }

    function reOrder(orderId) {
        api('POST', '/api/orders/' + orderId + '/reorder')
            .then(function (res) { result(res, '같은 상품으로 새 주문을 만들었습니다. 결제를 진행해주세요.'); });
    }
</script>
</body>
</html>
